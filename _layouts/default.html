<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">
      <span class="logo">⚡</span> {{ site.author.name }}
    </a>
    <nav class="site-nav">
      {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}">{{ item.title_zh }}</a>
      {% endfor %}
      <span class="lang-switch">
        <a href="{{ page.url | relative_url }}">中</a> /
        <a href="{{ page.url_en | default: '/' | relative_url }}">EN</a>
      </span>
    </nav>
  </div>
</header>

<main class="wrap site-main">
  {{ content }}
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>© {{ site.time | date: '%Y' }} {{ site.author.name }} · {{ site.author.company }}</p>
    <p class="footer-links">
      <a href="mailto:{{ site.author.email }}">Email</a> ·
      <a href="https://github.com/{{ site.author.github }}">GitHub</a> ·
      WeChat: {{ site.author.wechat }}
    </p>
  </div>
</footer>

</body>
</html>
